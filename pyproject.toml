[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "penny"
version = "0.1.0"
description = "Local personal finance agent backed by DuckDB + Claude"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pdfplumber>=0.11.0",
    "duckdb>=1.1.0",
    "plotly>=5.24.0",
    "kaleido>=0.2.1",
    "rich>=13.9.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
penny-ingest = "penny.scripts.ingest:main"
penny-enrich = "penny.scripts.enrich:main"
penny-chat   = "penny.scripts.chat:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
