[theme]
# Light theme, but warm off-white rather than stark/bright white — easier on
# the eyes for a chat surface someone reads for a while (same idea as
# Claude's own light theme, or a paper/cream tone vs. a cold #FFFFFF).
primaryColor = "#6C63FF"
backgroundColor = "#F7F5F0"
secondaryBackgroundColor = "#ECE8DF"
textColor = "#2B2A28"
font = "sans serif"

[server]
maxUploadSize = 50
headless = true

[browser]
gatherUsageStats = false

# Hides Streamlit's developer toolbar (Clear cache, Rerun, Deploy, ...) and —
# more importantly — the keyboard shortcuts tied to it. "C" alone triggers
# Clear Cache in dev mode, and Streamlit's listener doesn't check for a Ctrl
# modifier, so Ctrl+C (meant as copy) was firing it too. End users of a
# deployed financial app have no reason to see dev tooling anyway.
[client]
toolbarMode = "viewer"
