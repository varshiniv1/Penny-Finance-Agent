[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "penny"
version = "0.1.0"
description = "Local personal finance agent backed by DuckDB + Claude"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0,<1.0.0",
    "pdfplumber>=0.11.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
    "Pillow>=11.0.0",
    "duckdb>=1.1.0",
    "plotly>=5.24.0",
    "pandas>=2.0.0",
    "streamlit>=1.40.0,<2.0.0",
    "mcp>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
